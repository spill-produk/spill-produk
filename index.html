<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spill Produk — Katalog Outfit & Racun Shopee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FEF9C3;
      --bg-dots: #FDE047;
      --surface: #FFFBEB;
      --card-bg: #FFFFFF;
      --blue: #2563EB;
      --blue-dark: #1D4ED8;
      --blue-ink: #1E3A8A;
      --coral: #FB923C;
      --coral-hot: #F97316;
      --text-primary: #1E293B;
      --text-secondary: #475569;
      --border: #1E3A8A;
      --shadow-hard: 4px 4px 0px #1E3A8A;
      --shadow-sm: 3px 3px 0px #1E3A8A;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-pill: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(var(--bg-dots) 1.5px, transparent 1.5px);
      background-size: 22px 22px;
      color: var(--text-primary);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Creator Bio Header */
    .hero {
      background: var(--blue);
      color: #FFFFFF;
      border-bottom: 3px solid var(--border);
      padding: 28px 16px 24px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero-inner {
      max-width: 680px;
      margin: 0 auto;
      position: relative;
      z-index: 2;
    }

    .sticker-tag {
      display: inline-block;
      background: #FEF08A;
      color: var(--blue-ink);
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.04em;
      padding: 4px 14px;
      border-radius: var(--radius-pill);
      border: 2px solid var(--border);
      box-shadow: 2px 2px 0px var(--border);
      margin-bottom: 10px;
      transform: rotate(-1.5deg);
    }

    .hero h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: #FFFFFF;
      text-shadow: 2px 2px 0px var(--blue-ink);
      margin-bottom: 6px;
    }

    .hero p {
      font-size: 13.5px;
      font-weight: 600;
      color: #DBEAFE;
    }

    /* Sticky Search & Filter Bar */
    .sticky-controls {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(254, 249, 195, 0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 2.5px solid var(--border);
      padding: 12px 16px;
    }

    .controls-inner {
      max-width: 1120px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-icon {
      position: absolute;
      left: 15px;
      color: var(--blue-ink);
      pointer-events: none;
      display: flex;
    }

    .search-input {
      width: 100%;
      height: 46px;
      padding: 0 42px 0 44px;
      border-radius: var(--radius-pill);
      border: 2.5px solid var(--border);
      background: #FFFFFF;
      box-shadow: var(--shadow-sm);
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      outline: none;
    }

    .search-input::placeholder {
      color: #94A3B8;
      font-weight: 500;
    }

    .search-input:focus {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px var(--blue);
    }

    .clear-btn {
      position: absolute;
      right: 10px;
      width: 28px;
      height: 28px;
      border: 2px solid var(--border);
      border-radius: 50%;
      background: #FEF08A;
      color: var(--blue-ink);
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .clear-btn:hover {
      background: var(--coral);
      color: #FFFFFF;
    }

    .clear-btn.visible {
      display: flex;
    }

    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .filter-row::-webkit-scrollbar {
      display: none;
    }

    .pills {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .pill {
      padding: 6px 15px;
      border-radius: var(--radius-pill);
      border: 2px solid var(--border);
      background: #FFFFFF;
      color: var(--blue-ink);
      font-family: 'Fredoka', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 2px 2px 0px var(--border);
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .pill:hover {
      background: #DBEAFE;
    }

    .pill.active {
      background: var(--blue);
      color: #FFFFFF;
      transform: translate(-1px, -1px);
      box-shadow: 3px 3px 0px var(--border);
    }

    .sort-select {
      padding: 6px 13px;
      border-radius: var(--radius-pill);
      border: 2px solid var(--border);
      background: #FFFBEB;
      color: var(--blue-ink);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      box-shadow: 2px 2px 0px var(--border);
      cursor: pointer;
      outline: none;
      flex-shrink: 0;
    }

    /* Main Container */
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 18px 16px 52px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .count-pill {
      display: inline-block;
      background: #FFFFFF;
      border: 2px solid var(--border);
      border-radius: var(--radius-pill);
      padding: 4px 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--blue-ink);
      box-shadow: 2px 2px 0px var(--border);
    }

    /* Product Grid: 2 Columns on Mobile, 4 on Desktop */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }
    }

    @media (min-width: 960px) {
      .grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 20px;
      }
    }

    /* Retro Bento Card */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      overflow: hidden;
      border: 2.5px solid var(--border);
      box-shadow: var(--shadow-hard);
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }

    .card:hover {
      transform: translate(-2px, -3px);
      box-shadow: 6px 6px 0px var(--border);
    }

    .thumb-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #FEF3C7;
      border-bottom: 2.5px solid var(--border);
      overflow: hidden;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }

    .card:hover .thumb-wrap img {
      transform: scale(1.04);
    }

    .thumb-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka', sans-serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--blue-ink);
    }

    .no-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 10px;
      border-radius: var(--radius-pill);
      background: var(--coral);
      border: 2px solid var(--border);
      box-shadow: 2px 2px 0px var(--border);
      color: #FFFFFF;
      font-family: 'Fredoka', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      text-shadow: 1px 1px 0px var(--blue-ink);
    }

    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 6px;
      background: var(--surface);
    }

    @media (min-width: 640px) {
      .card-body {
        padding: 14px;
      }
    }

    .cat-label {
      display: inline-block;
      align-self: flex-start;
      padding: 2px 8px;
      border-radius: 6px;
      background: #DBEAFE;
      color: var(--blue-dark);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .prod-title {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.38;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.76em;
    }

    .buy-btn {
      margin-top: auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      padding: 9px 12px;
      border-radius: var(--radius-md);
      background: var(--blue);
      border: 2px solid var(--border);
      box-shadow: 2px 2px 0px var(--border);
      color: #FFFFFF;
      text-decoration: none;
      font-family: 'Fredoka', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.1s ease;
    }

    .buy-btn:hover {
      background: var(--coral-hot);
    }

    .buy-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px var(--border);
    }

    /* Load More & Empty State */
    .load-more-wrap {
      margin-top: 30px;
      text-align: center;
    }

    .load-more-btn {
      padding: 12px 30px;
      border-radius: var(--radius-pill);
      border: 2.5px solid var(--border);
      background: #FEF08A;
      color: var(--blue-ink);
      font-family: 'Fredoka', sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      box-shadow: var(--shadow-hard);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .load-more-btn:hover {
      background: var(--coral);
      color: #FFFFFF;
      transform: translate(-1px, -2px);
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      background: #FFFFFF;
      border: 2.5px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-hard);
      color: var(--text-secondary);
      display: none;
    }

    .empty-state h3 {
      font-family: 'Fredoka', sans-serif;
      color: var(--blue-ink);
      font-size: 18px;
      margin-bottom: 6px;
    }

    /* Back to Top Floating Button */
    .top-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2.5px solid var(--border);
      background: #FEF08A;
      color: var(--blue-ink);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 40;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .top-btn:hover {
      background: var(--coral);
      color: #FFFFFF;
      transform: translate(-1px, -2px);
    }
  </style>
</head>
<body>

  <header class="hero">
    <div class="hero-inner">
      <div class="sticker-tag">★ OUTFIT & RACUN SHOPEE</div>
      <h1>Spill Produk Katalog</h1>
      <p>Ketik nomor produk sesuai di video Reels / Shorts buat langsung checkout ✨</p>
    </div>
  </header>

  <div class="sticky-controls">
    <div class="controls-inner">
      <div class="search-box">
        <span class="search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input
          type="text"
          id="searchInput"
          class="search-input"
          placeholder="Cari nomor produk (misal: 2979) atau nama outfit..."
          autocomplete="off"
        />
        <button type="button" id="clearBtn" class="clear-btn" aria-label="Hapus pencarian">&times;</button>
      </div>

      <div class="filter-row">
        <div class="pills" id="categoryPills">
          <button class="pill active" data-cat="Semua">Semua</button>
          <button class="pill" data-cat="Atasan">Atasan</button>
          <button class="pill" data-cat="Bawahan">Bawahan</button>
          <button class="pill" data-cat="Aksesoris">Aksesoris</button>
          <button class="pill" data-cat="Lainnya">Lainnya</button>
        </div>

        <select id="sortSelect" class="sort-select" aria-label="Urutkan produk">
          <option value="asc">No. 1 → Terbaru</option>
          <option value="desc">Terbaru → No. 1</option>
        </select>
      </div>
    </div>
  </div>

  <main class="container">
    <div class="status-bar">
      <span id="countInfo" class="count-pill">Memuat katalog...</span>
    </div>

    <div class="grid" id="productGrid"></div>

    <div class="empty-state" id="emptyState">
      <h3>Produk tidak ditemukan</h3>
      <p>Coba cek lagi nomor produknya atau pilih tab kategori "Semua".</p>
    </div>

    <div class="load-more-wrap" id="loadMoreWrap" style="display: none;">
      <button type="button" id="loadMoreBtn" class="load-more-btn">Muat Lebih Banyak ✨</button>
    </div>
  </main>

  <button type="button" id="topBtn" class="top-btn" aria-label="Kembali ke atas">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="18 15 12 9 6 15"></polyline>
    </svg>
  </button>

  <script>
    let allProducts = [];
    let filteredProducts = [];
    let currentCategory = 'Semua';
    let currentSort = 'asc';
    let visibleCount = 24;
    const PAGE_SIZE = 24;

    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');
    const categoryPills = document.getElementById('categoryPills');
    const sortSelect = document.getElementById('sortSelect');
    const productGrid = document.getElementById('productGrid');
    const countInfo = document.getElementById('countInfo');
    const emptyState = document.getElementById('emptyState');
    const loadMoreWrap = document.getElementById('loadMoreWrap');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const topBtn = document.getElementById('topBtn');

    async function loadCatalog() {
      try {
        const res = await fetch('products.json?v=' + Date.now());
        allProducts = await res.json();
        applyFilters();
      } catch (err) {
        countInfo.textContent = 'Gagal memuat products.json';
      }
    }

    function applyFilters() {
      const query
